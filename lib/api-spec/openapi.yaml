openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SRI - Release Go Live Control API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Current user and access control
  - name: users
    description: User administration and approvals
  - name: perfis
    description: Access profiles (RBAC) administration
  - name: objetos
    description: System objects/resources for RBAC permissions
  - name: scenarios
    description: Release test scenarios
  - name: lookups
    description: Domain lookup values used by selects
  - name: escala
    description: On-call schedule
  - name: contatos
    description: Contact directory
  - name: dashboard
    description: Consolidated dashboards
  - name: evidencias
    description: Release test evidence files per scenario
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current authenticated user
      description: Returns the current user record, provisioning it on first login.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Register an authorized third party (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user's status or profile (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: List release test scenarios
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: prioridade
          in: query
          required: false
          schema:
            type: string
        - name: site
          in: query
          required: false
          schema:
            type: string
        - name: sistema
          in: query
          required: false
          schema:
            type: string
        - name: statusCenario
          in: query
          required: false
          schema:
            type: string
        - name: macroProcesso
          in: query
          required: false
          schema:
            type: string
        - name: quemExecuta
          in: query
          required: false
          schema:
            type: string
        - name: facilitador
          in: query
          required: false
          schema:
            type: string
        - name: keyUser
          in: query
          required: false
          schema:
            type: string
        - name: superUser
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"
    post:
      operationId: createScenario
      tags: [scenarios]
      summary: Create a scenario (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioInput"
      responses:
        "201":
          description: Created scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
  /scenarios/{id}:
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: Get a scenario by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateScenario
      tags: [scenarios]
      summary: Update a scenario (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdate"
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteScenario
      tags: [scenarios]
      summary: Delete a scenario (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /scenarios/{id}/status:
    patch:
      operationId: updateScenarioStatus
      tags: [scenarios]
      summary: Update only the status of a scenario
      description: Requires the cenarios:alterar_status permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioStatusUpdate"
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /perfis:
    get:
      operationId: listPerfis
      tags: [perfis]
      summary: List access profiles (admin only)
      responses:
        "200":
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Perfil"
    post:
      operationId: createPerfil
      tags: [perfis]
      summary: Create an access profile (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilInput"
      responses:
        "201":
          description: Created profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"
        "409":
          description: Profile key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /perfis/{id}:
    patch:
      operationId: updatePerfil
      tags: [perfis]
      summary: Update an access profile (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePerfil
      tags: [perfis]
      summary: Delete a custom access profile (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: System profile cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /perfis/{id}/permissoes:
    get:
      operationId: getPerfilPermissoes
      tags: [perfis]
      summary: Get the permission grants of a profile (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Permission grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permissao"
    put:
      operationId: setPerfilPermissoes
      tags: [perfis]
      summary: Replace the permission grants of a profile (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilPermissoesInput"
      responses:
        "200":
          description: Updated permission grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permissao"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /objetos:
    get:
      operationId: listObjetos
      tags: [objetos]
      summary: List system objects/resources (admin only)
      responses:
        "200":
          description: List of objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Objeto"
    post:
      operationId: createObjeto
      tags: [objetos]
      summary: Create a system object (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjetoInput"
      responses:
        "201":
          description: Created object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objeto"
        "409":
          description: Object key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /objetos/{id}:
    patch:
      operationId: updateObjeto
      tags: [objetos]
      summary: Update a system object (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjetoUpdate"
      responses:
        "200":
          description: Updated object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objeto"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteObjeto
      tags: [objetos]
      summary: Delete a custom object (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: System object cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lookups:
    get:
      operationId: listLookups
      tags: [lookups]
      summary: List domain lookup values
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of lookup values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lookup"
    post:
      operationId: createLookup
      tags: [lookups]
      summary: Create a lookup value (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupInput"
      responses:
        "201":
          description: Created lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lookup"
  /lookups/{id}:
    patch:
      operationId: updateLookup
      tags: [lookups]
      summary: Update a lookup value (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupUpdate"
      responses:
        "200":
          description: Updated lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lookup"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteLookup
      tags: [lookups]
      summary: Delete a lookup value (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /escala:
    get:
      operationId: listEscala
      tags: [escala]
      summary: List on-call schedule entries
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of schedule entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Escala"
    post:
      operationId: createEscala
      tags: [escala]
      summary: Create a schedule entry (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalaInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escala"
  /escala/{id}:
    patch:
      operationId: updateEscala
      tags: [escala]
      summary: Update a schedule entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalaUpdate"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escala"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEscala
      tags: [escala]
      summary: Delete a schedule entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /contatos:
    get:
      operationId: listContatos
      tags: [contatos]
      summary: List contacts
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contato"
    post:
      operationId: createContato
      tags: [contatos]
      summary: Create a contact (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContatoInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contato"
  /contatos/{id}:
    patch:
      operationId: updateContato
      tags: [contatos]
      summary: Update a contact (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContatoUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contato"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteContato
      tags: [contatos]
      summary: Delete a contact (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Consolidated dashboard counts
      parameters:
        - name: prioridade
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/matrix:
    get:
      operationId: getDashboardMatrix
      tags: [dashboard]
      summary: Site x Status matrix with totals and percentages
      parameters:
        - name: prioridade
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMatrix"

  /scenarios/{id}/evidencias:
    get:
      operationId: listEvidencias
      tags: [evidencias]
      summary: List evidence files for a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of evidences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidencia"
    post:
      operationId: createEvidencia
      tags: [evidencias]
      summary: Register an uploaded evidence file (uploaders only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenciaInput"
      responses:
        "201":
          description: Created evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidencia"
        "404":
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /scenarios/{id}/evidencias/concluir:
    post:
      operationId: concluirEvidencias
      tags: [evidencias]
      summary: Mark all evidence uploads as completed for a scenario (uploaders only)
      description: |
        Sets the scenario status to "Evidências Enviadas". Allowed for the same
        users that can upload evidence (requireUploader).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /evidencias/monitor:
    get:
      operationId: getEvidenciasMonitor
      tags: [evidencias]
      summary: Consolidated monitoring of evidence deliveries
      description: |
        Returns per-scenario evidence delivery rows plus consolidated counts
        grouped by macro process, site, system and priority. Requires the
        evidencias:consultar permission.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: prioridade
          in: query
          required: false
          schema:
            type: string
        - name: site
          in: query
          required: false
          schema:
            type: string
        - name: sistema
          in: query
          required: false
          schema:
            type: string
        - name: macroProcesso
          in: query
          required: false
          schema:
            type: string
        - name: quemExecuta
          in: query
          required: false
          schema:
            type: string
        - name: facilitador
          in: query
          required: false
          schema:
            type: string
        - name: keyUser
          in: query
          required: false
          schema:
            type: string
        - name: superUser
          in: query
          required: false
          schema:
            type: string
        - name: statusCenario
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Evidence delivery monitoring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenciasMonitor"

  /evidencias/{id}:
    delete:
      operationId: deleteEvidencia
      tags: [evidencias]
      summary: Delete an evidence file (uploaders only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an evidence file from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    User:
      type: object
      required: [id, email, profile, status]
      properties:
        id:
          type: integer
        clerkUserId:
          type: ["string", "null"]
        email:
          type: string
        name:
